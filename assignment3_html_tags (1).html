<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3 - Hyperlinks and Images</title>
    <style>
        body {
            margin: 40px;
            background-color: #fce4ec; /* Light pink background */
        }
        .content {
            background-color: white;
            padding: 20px;
            border: 2px solid lightblue;
        }
        h1 {
            color: maroon;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Assignment 3: Link, Image and Formatting</h1>

        <h3>1. Hyperlink and Image</h3>
        <p>Go to <a href="assignment1_basic_html.html">Assignment 1</a></p>
        
        <p>This is a sample image:</p>
        <img src="Webpageimage.avif" alt="CUTE dog image" width="1050" height="825">

        <h3>2. Text Formatting</h3>
        <!-- Bold Tag -->
        <p>This text is <b>bold</b>.</p>
        
        <!-- Italic Tag -->
        <p>This text is <i>italic</i>.</p>
        
        <!-- Underline Tag -->
        <p>This text is <u>underlined</u>.</p>
        
        <!-- Strong Tag -->
        <p>This text is <strong>strong</strong>.</p>
        
        <!-- Emphasize Tag -->
        <p>This text is <em>emphasized</em>.</p>
    </div>

</body>
</html>
